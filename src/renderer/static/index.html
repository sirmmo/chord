<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>Chord</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="titlebar">
      <button class="icon-btn" id="collapse" title="Hide sidebar (⌘S)"></button>
      <button class="now-mini hidden" id="now-mini" title="Now playing"><span class="art"></span><span class="t"></span></button>
      <button class="icon-btn now-mini-pp hidden" id="now-mini-pp" title="Play/Pause"></button>
      <button class="chip hidden" id="chip"><span class="chip-icon"></span><span class="t"></span></button>
      <span class="spacer"></span>
      <button class="icon-btn dl-btn hidden" id="dl-btn" title="Downloads (⌘⇧J)"><span class="ring"></span><span class="badge"></span></button>
      <button class="icon-btn" id="settings-btn" title="Settings (⌘,)"></button>
      <button class="icon-btn" id="back" title="Back (⌘[)"></button>
      <button class="icon-btn" id="forward" title="Forward (⌘])"></button>
      <button class="icon-btn" id="reload" title="Reload (⌘R)"></button>
    </div>
    <button class="urlbar placeholder" id="urlbar" title="Edit URL (⌘L)">
      <span class="lock"></span><span class="host">Search or enter URL</span>
    </button>
    <div id="favorites" class="list grid"></div>
    <div class="space-header">
      <span class="space-icon" id="space-icon"></span>
      <span class="name" id="space-name"></span>
      <span class="profile-pill hidden" id="space-profile" title="Browsing profile: separate cookies and logins"></span>
      <button class="icon-btn small modes-btn" id="space-modes" title="Modes: research, AI…"></button>
      <button class="icon-btn small" id="space-menu" title="Space options"></button>
    </div>
    <div class="install hidden" id="update"><span id="update-text"></span><span class="install-btns"><button id="update-go"></button><button id="update-no" title="Not now">×</button></span></div>
    <div class="install hidden" id="install"><span id="install-text"></span><span class="install-btns"><button id="install-go">Install</button><button id="install-no" title="Not now">×</button></span></div>
    <div class="locked-panel" id="locked">
      <div class="lock-icon"></div>
      <div class="lock-title">This space is locked</div>
      <button class="btn-unlock" id="unlock">Unlock…</button>
    </div>
    <div class="lists">
      <div id="pinned" class="list"></div>
      <div class="divider" id="pinned-divider"></div>
      <div class="section-header"><span>Today</span><button id="clear-today" title="Archive all of today’s tabs">Clear</button></div>
      <div id="today" class="list"></div>
      <button class="new-tab" id="new-tab"><span class="plus"></span>New Tab</button>
    </div>
    <button class="dl-row hidden" id="dl-row" title="Open downloads (⌘⇧J)"><span class="dl-text"><span class="title" id="dl-title"></span><span class="sub" id="dl-sub"></span></span><span class="bar"><i id="dl-bar"></i></span></button>
    <div class="call hidden" id="call">
      <button class="call-main" id="call-open" title="Go to the call"><span class="dot"></span><span class="text"><span class="title" id="call-title">In a call</span><span class="sub" id="call-sub"></span></span></button>
      <div class="now-controls"><button class="icon-btn" id="call-mute" title="Mute"></button><button class="icon-btn" id="call-cam" title="Camera"></button><button class="icon-btn danger" id="call-leave" title="Leave call"></button></div>
    </div>
    <div id="devs"></div>
    <div id="players"></div>
    <footer>
      <div id="spaces"></div>
      <button class="icon-btn" id="add-space" title="New space (⌘⇧N)"></button>
    </footer>
    <div class="resizer" id="resizer"></div>
  </aside>
  <div id="gutters"></div>
  <div id="edge" title="Show sidebar (⌘S)"></div>
  <div id="topbar"></div>
  <main id="stage">
    <div id="addressbar">
      <button class="icon-btn" id="ab-back" title="Back"></button>
      <button class="icon-btn" id="ab-forward" title="Forward"></button>
      <button class="icon-btn" id="ab-reload" title="Reload"></button>
      <div class="field"><span class="lock" id="ab-lock"></span><input id="address" type="text" placeholder="Search or enter URL" autocomplete="off" spellcheck="false"></div>
      <button class="now-mini hidden" id="ab-now" title="Now playing"><span class="art"></span><span class="t"></span></button>
      <button class="icon-btn now-mini-pp hidden" id="ab-now-pp" title="Play/Pause"></button>
    </div>
    <div class="stage-body">
      <div class="empty-msg">
        <div class="big">Nothing open</div>
        <div>Press <kbd>⌘T</kbd> to search or open a page</div>
      </div>
    </div>
  </main>
  <script src="sidebar.js"></script>
</body>
</html>
