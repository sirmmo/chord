<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>Peek</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; margin: 0; }
    body { background: var(--bg); }
    body.backdrop { background: rgba(0, 0, 0, .42); }
    .bar { position: fixed; inset: 0; height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box; border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
    .bar .pill { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-radius: 8px; background: var(--hover); font-size: 12.5px; }
    .bar .pill .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .bar .pill .h { color: var(--muted); flex: none; font-size: 12px; }
    .bar .open { font: inherit; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 0 10px; height: 26px; cursor: default; white-space: nowrap; }
    .bar .open:hover { filter: brightness(1.08); }
    .bar .sub { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--hover); border: 0; border-radius: 8px; padding: 0 10px; height: 26px; cursor: default; white-space: nowrap; }
    .bar .sub:hover { background: var(--bar); }
    .bar .peek-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 6px; }
    body.backdrop .bar { display: none; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="peek-label">Peek</span>
    <button class="icon-btn" id="back" title="Back"></button>
    <button class="icon-btn" id="forward" title="Forward"></button>
    <button class="icon-btn" id="reload" title="Reload"></button>
    <div class="pill" id="pill"><span class="t" id="title">Loading…</span><span class="h" id="host"></span></div>
    <button class="sub" id="little" title="Continue in a Little window">Little window</button>
    <button class="open" id="open" title="Open as a tab in this space (⌘⇧O)">Open as Tab</button>
    <button class="icon-btn" id="close" title="Close (Esc)"></button>
  </div>
  <script src="peek.js"></script>
</body>
</html>
