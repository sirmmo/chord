<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>Bookmarks</title>
  <link rel="stylesheet" href="internal.css">
  <style>
    .search { display: flex; gap: 8px; margin: 0 0 12px; }
    .search input { flex: 1; font: inherit; font-size: 14px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; outline: none; }
    .search input:focus { border-color: var(--accent); }
    .seg { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px; }
    .seg button.on { background: var(--accent); color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
    .chip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 2px 10px; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .bm { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); margin-bottom: 8px; }
    .bm .title { font-weight: 600; color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bm .title:hover { color: var(--accent); }
    .bm .host { font-size: 12px; color: var(--muted); }
    .bm .note { grid-column: 1 / -1; font-size: 13px; color: var(--fg); white-space: pre-wrap; }
    .bm .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
    .bm .tag { color: var(--accent); }
    .bm .vis { padding: 0 7px; border-radius: 4px; background: var(--hover); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .bm .vis.pub { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    .bm .btns { display: flex; gap: 4px; }
    .bm .btns button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 2px 7px; border-radius: 5px; }
    .bm .btns button:hover { background: var(--hover); color: var(--fg); }
    .bm .btns button.danger:hover { color: var(--danger); }
    .bm form { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 6px; }
    .bm form input, .bm form textarea { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; outline: none; }
    .bm form textarea { min-height: 54px; resize: vertical; }
    .bm form .row { display: flex; gap: 8px; align-items: center; }
    .pages { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
    .pages a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Bookmarks</h1>
      <div class="actions"><button class="btn" id="add">Bookmark current page</button><button class="btn" id="sync">Sync settings</button></div>
    </header>
    <p class="pages" id="pages"></p>
    <div class="search">
      <input id="q" type="search" placeholder="Search bookmarks" autocomplete="off" spellcheck="false">
      <div class="seg" id="vis"><button data-v="all" class="on">All</button><button data-v="public">Public</button><button data-v="private">Private</button></div>
    </div>
    <div class="chips" id="chips"></div>
    <p class="summary" id="summary"></p>
    <div id="list"></div>
    <p class="empty" id="empty">No bookmarks yet. ⌘⇧B bookmarks the current page; the tab menu and the command bar offer public ones, which are published on your GitHub Pages linkroll once sync is on.</p>
  </main>
  <script src="bookmarks.js"></script>
</body>
</html>
