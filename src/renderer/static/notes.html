<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>Notes</title>
  <link rel="stylesheet" href="internal.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .notes { display: flex; flex-direction: column; height: 100vh; }
    .top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .top h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top select { font: inherit; font-size: 13px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
    .seg { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px; padding: 4px 10px; border-radius: 6px; }
    .seg button.on { background: var(--accent); color: #fff; }
    .work { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
    .work.edit-only { grid-template-columns: 1fr; }
    .work.view-only { grid-template-columns: 1fr; }
    .work.edit-only .preview, .work.view-only .editor { display: none; }
    .editor { border-right: 1px solid var(--line); display: flex; }
    .work.edit-only .editor { border-right: 0; }
    textarea { flex: 1; width: 100%; resize: none; border: 0; outline: none; padding: 20px 22px; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--fg); background: transparent; tab-size: 2; }
    .preview { overflow-y: auto; padding: 20px 28px 60px; line-height: 1.6; }
    .preview h1 { font-size: 24px; margin: 0.4em 0 0.3em; } .preview h2 { font-size: 20px; } .preview h3 { font-size: 16px; }
    .preview pre { background: var(--card); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 13px; }
    .preview code { background: var(--card); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
    .preview pre code { background: none; padding: 0; }
    .preview blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
    .preview table { border-collapse: collapse; } .preview th, .preview td { border: 1px solid var(--line); padding: 4px 8px; }
    .preview li.task { list-style: none; margin-left: -18px; } .preview li.done { color: var(--muted); text-decoration: line-through; }
    .preview img { max-width: 100%; border-radius: 6px; }
    .preview a { color: var(--accent); }
    .status { padding: 6px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 12px; }
    .all { padding: 24px 28px 60px; overflow-y: auto; }
    .all section { margin-bottom: 28px; }
    .all h2.space { font-size: 14px; display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
    .all h2.space .dot { width: 10px; height: 10px; border-radius: 50%; }
    .all h2.space a { font-size: 12px; font-weight: 400; color: var(--muted); }
    .all .body { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); line-height: 1.55; }
    .all .body p { margin: 0 0 6px; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <div class="notes">
    <div class="top">
      <h1 id="title">Notes</h1>
      <select id="space-pick" hidden></select>
      <button class="btn" id="insert-link" title="Insert a link to the current page">Link to current page</button>
      <div class="seg" id="mode"><button data-v="split" class="on">Split</button><button data-v="edit">Edit</button><button data-v="view">Preview</button></div>
    </div>
    <div class="work" id="work">
      <div class="editor"><textarea id="text" placeholder="Notes for this space, in Markdown: # headings, **bold**, - lists, - [ ] tasks, `code`, > quotes, [links](https://…)" spellcheck="true"></textarea></div>
      <div class="preview" id="preview"></div>
    </div>
    <div class="all" id="all" hidden></div>
    <div class="status"><span id="saved"></span><span id="count"></span></div>
  </div>
  <script src="notes.js"></script>
</body>
</html>
