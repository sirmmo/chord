<!doctype html>
<html lang="en">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Downloads</title>
  <link rel="stylesheet" href="internal.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Downloads</h1>
      <div class="actions">
