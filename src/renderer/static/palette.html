<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>Chord command bar</title>
  <link rel="stylesheet" href="palette.css">
</head>
<body>
  <div id="backdrop">
    <div id="box" role="dialog" aria-label="Command bar">
      <div class="input-row">
        <span class="icon" id="input-icon"></span>
        <input id="input" type="text" placeholder="Search, enter a URL, or type a command…" autocomplete="off" spellcheck="false">
        <span class="hint" id="intent"></span>
      </div>
      <ul id="results"></ul>
      <div id="pw-help"></div>
    </div>
  </div>
  <div id="dl-backdrop">
    <div id="dl-panel" role="dialog" aria-label="Downloads">
      <div class="dl-head"><strong>Downloads</strong><span class="spacer"></span><button class="btn" id="dl-folder">Open Folder</button><button class="btn" id="dl-all">Show All</button></div>
      <div id="dl-list"></div>
      <p class="dl-empty" id="dl-empty">Nothing downloaded yet.</p>
    </div>
  </div>
  <div id="cap-backdrop">
    <div id="cap-panel" role="dialog" aria-label="Share your screen">
      <div class="cap-head"><strong id="cap-title">Share your screen</strong><span class="spacer"></span><button class="btn" id="cap-cancel">Cancel</button></div>
      <div class="cap-tabs" id="cap-tabs"></div>
      <div id="cap-grid"></div>
      <p class="cap-note" id="cap-note"></p>
      <p class="cap-perm" id="cap-perm">macOS has not let Chord record the screen yet. <button class="btn" id="cap-settings">Open Screen Recording settings</button> Turn Chord on there, then try sharing again.</p>
    </div>
  </div>
  <div id="findbar">
    <input id="find-input" type="text" placeholder="Find in page" autocomplete="off" spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous (⇧↩)">‹</button>
    <button id="find-next" title="Next (↩)">›</button>
    <button id="find-close" title="Close (Esc)">×</button>
  </div>
  <script src="palette.js"></script>
</body>
</html>
