<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
  <title>Chord command bar</title>
  <link rel="stylesheet" href="palette.css">
</head>
<body>
  <div id="backdrop">
    <div id="box" role="dialog" aria-label="Command bar">
      <div class="input-row">
        <span class="icon" id="input-icon"></span>
        <input id="input" type="text" placeholder="Search, enter a URL, or type a command…" autocomplete="off" spellcheck="false">
        <span class="hint" id="intent"></span>
      </div>
      <ul id="results"></ul>
    </div>
  </div>
  <div id="settings-backdrop">
    <div id="settings" role="dialog" aria-label="Appearance">
      <div class="s-head"><h2>Appearance</h2><button id="settings-close" title="Close (Esc)">×</button></div>
      <div class="s-grid">
        <label>Theme</label>
        <div class="seg" id="s-mode"><button data-v="system">System</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>

        <label>Colour of <span id="s-space-name">this space</span></label>
        <div class="row"><div class="swatches" id="s-swatches"></div><input type="color" id="s-space-color" title="Custom colour"></div>

        <label>Tint strength</label>
        <div class="row"><input type="range" min="0" max="100" id="s-tint"><span class="val" id="s-tint-val"></span></div>

        <label>Accent</label>
        <div class="row"><label class="check"><input type="checkbox" id="s-accent-follow"> Follow space colour</label><input type="color" id="s-accent"></div>

        <label>Icons</label>
        <div class="seg" id="s-icons"><button data-v="color">Colour</button><button data-v="mono">Monochrome</button></div>

        <label>Icon colour</label>
        <div class="row"><label class="check"><input type="checkbox" id="s-icon-follow"> Follow text colour</label><input type="color" id="s-icon-color"></div>

        <label>Font</label>
        <select id="s-font"><option value="system">System</option><option value="rounded">Rounded</option><option value="mono">Monospace</option><option value="serif">Serif</option></select>

        <label>Archive tabs after</label>
        <select id="s-archive"><option value="12">12 hours</option><option value="24">24 hours</option><option value="168">7 days</option><option value="720">30 days</option><option value="0">Never</option></select>

        <label>Search engine</label>
        <select id="s-engine"></select>

        <label>Shields</label>
        <label class="check"><input type="checkbox" id="s-shields"> Block ads and trackers</label>
      </div>
      <p class="s-foot">Changes apply immediately and are saved with your configuration.</p>
    </div>
  </div>
  <div id="findbar">
    <input id="find-input" type="text" placeholder="Find in page" autocomplete="off" spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous (⇧↩)">‹</button>
    <button id="find-next" title="Next (↩)">›</button>
    <button id="find-close" title="Close (Esc)">×</button>
  </div>
  <script src="palette.js"></script>
</body>
</html>
