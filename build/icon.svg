<!-- Chord app icon source. build/icon.png is rendered from the same geometry (see git history for the ImageMagick commands). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b6cff"/><stop offset="1" stop-color="#425cff"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- the segment the chord cuts off -->
  <path d="M554.8 207.8 A307.2 307.2 0 0 1 796.8 627 Z" fill="#fff" fill-opacity="0.45"/>
  <circle cx="512" cy="512" r="307.2" fill="none" stroke="#fff" stroke-width="59.5"/>
  <line x1="554.8" y1="207.8" x2="796.8" y2="627" stroke="#fff" stroke-width="59.5" stroke-linecap="round"/>
</svg>
