name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  check:
    name: Type-check and test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            artifact: mac
            os: macos-latest
            args: --mac --universal
            files: release/*.dmg
          # Electron 44+ needs macOS 13: this second build on Electron 43 keeps Monterey (12) users going.
          - name: macOS (legacy, Electron 43 for macOS 12)
            artifact: mac-legacy
            os: macos-latest
            args: --mac --universal -c.electronVersion=43.8.3+wvcus '-c.artifactName=Chord-${version}-${os}-${arch}-legacy.${ext}'
            files: release/*-legacy.dmg
          - name: Windows (x64)
            artifact: windows
            os: windows-latest
            args: --win --x64
            files: |
              release/*.exe
              release/*.zip
              release/latest*.yml
          - name: Linux (x64)
            artifact: linux
            os: ubuntu-latest
            args: --linux --x64
            files: |
              release/*.AppImage
              release/*.deb
              release/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm run build
      - name: castLabs EVS client (Widevine VMP signing)
        if: runner.os != 'Linux'
        shell: bash
        run: python3 -m pip install --upgrade castlabs-evs || python -m pip install --upgrade castlabs-evs
      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Builds are unsigned until signing certificates are configured as secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Widevine: build/afterPack.js VMP-signs macOS and Windows builds when these secrets exist.
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: 1
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Set-Content -Path release/win-unpacked/portable.txt -Value "Chord keeps its profile in the ChordData folder next to Chord.exe while this file exists."
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/Chord-$version-win-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: chord-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Chord $tag" --generate-notes
          fi
          gh release upload "$tag" artifacts/* --clobber
